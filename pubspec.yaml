name: abherbs_flutter
description: Flutter version of abherbs

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Read more about versioning at semver.org.
version: 8.1.0+811

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.5
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  firebase_analytics: 12.4.6
  firebase_auth: 6.5.7
  firebase_storage: 13.4.6
  firebase_database: 12.4.7
  firebase_remote_config: 6.5.6
  firebase_crashlytics: 5.2.7
  firebase_performance: 0.11.4+6
  google_maps_flutter: 2.18.0
  google_maps_flutter_ios_sdk10: 2.18.5
  google_mobile_ads: 9.0.0
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.1.0
  device_info_plus: 13.2.0
  in_app_purchase: 3.3.0
  cached_network_image: 3.4.1
  url_launcher: 6.3.2
  url_launcher_ios: 6.4.1
  http: 1.6.0
  share_plus: 13.3.0
  fluttertoast: 10.0.0
  diacritic: 0.1.6
  path_provider: 2.1.6
  percent_indicator: 4.2.5
  package_info_plus: 10.2.1
  image_picker: 1.2.3
  exif: 3.3.0
  permission_handler: 13.0.1
  datetime_picker_formfield_new: 2.1.0
  connectivity_plus: 7.3.1
  photo_view: 0.15.0
  youtube_player_iframe: 6.0.2
  app_tracking_transparency: 2.0.7
  country_picker: 2.0.28
  community_charts_flutter: 1.0.4
  country_icons: 3.0.0
  wakelock_plus: 1.7.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: 1.0.9
  intl_utils: 2.8.16

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  config:
    enable-swift-package-manager: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  assets:
    - res/images/
    - data/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages
flutter_intl:
  enabled: true